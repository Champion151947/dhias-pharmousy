# Render blueprint: https://render.com/docs/blueprint-spec
#
# Deploy by clicking the "Deploy to Render" button in README.md, or in the
# dashboard: New > Blueprint > Connect this repo > Deploy Blueprint.
#
# This file is intentionally minimal. Every setting here is one that is
# definitely valid on the free plan; a wrong region, an empty env value, or a
# deprecated field will fail the whole deploy.
#
# Anything not listed falls back to the app's own built-in default, which is
# what you want for a demo:
#   ADMIN_PASSWORD  unset  -> demo mode on, published demo logins work
#   ADMIN_EMAIL     defaults to admin@dhiaspharmousy.in
#   DATA_DIR        defaults to <repo>/data  (ephemeral on the free plan)

services:
  - type: web
    name: dhias-pharmousy
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node api/src/server.js
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      # Generated fresh for this service. Never shared or committed.
      - key: JWT_SECRET
        generateValue: true

      # Seeds the product catalogue on an empty store. Safe in production: in
      # demo mode the seed creates the two published demo logins, nothing more.
      - key: AUTO_SEED
        value: "true"

      # `console` prints OTPs to the service log. Switch to msg91 or twilio
      # once you have provider credentials, or real logins will not work.
      - key: OTP_PROVIDER
        value: console

# ---------------------------------------------------------------------------
# If you outgrow the demo, these are the changes to make (each one costs money,
# so they are left off by default):
#
#   * Persistent data - set `plan: starter` and add:
#       disk:
#         name: pharmacy-data
#         mountPath: <repo>/data
#         sizeGB: 1
#
#   * Turn demo mode off - add an ADMIN_PASSWORD of 12+ characters. The app then
#     stops creating the demo accounts and uses your password instead.
# ---------------------------------------------------------------------------
