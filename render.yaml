# Render blueprint: https://render.com/docs/blueprint-spec
#
# Deploy with:  gh render blueprint launch  (or "New > Blueprint" in the
# dashboard and point it at this repository).
#
# ---------------------------------------------------------------------------
# READ THIS BEFORE YOU ENABLE FREE LIVE ORDERS
# ---------------------------------------------------------------------------
# The `free` plan below has NO persistent disk and sleeps after ~15 minutes
# idle. Every restart or deploy therefore resets data/db.json and
# data/uploads, and the app re-seeds an empty catalogue. Any order,
# prescription, or patient address taken in the meantime is gone.
#
# That is fine for a demo. For a live pharmacy, switch `plan` to `starter`
# and uncomment the `disk` block at the bottom, or deploy to a host with a
# real volume and set DATA_DIR to its mount point.
#
# You do NOT need to set a password. The blueprint deploys in demo mode, so
# the site is immediately clickable and the demo accounts below are published
# in the README. Anyone who reads the source can sign in as admin and edit
# this data, which is fine for a demo and is why the free plan resets storage.
#
# To turn demo mode off later: set ADMIN_PASSWORD to any 12+ character value
# in the Render dashboard.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: dhias-pharmousy
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: node api/src/server.js
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # Render injects this automatically; the app reads it to bind the port.
      - key: PORT
        value: 4000

      # Generated fresh for this service. Never shared or committed.
      - key: JWT_SECRET
        generateValue: true

      # OPTIONAL. Leave blank to stay in demo mode, where the published demo
      # credentials work and the site is clickable by anyone. Set any 12+
      # character value to disable demo mode.
      - key: ADMIN_PASSWORD
        value: ""

      - key: ADMIN_EMAIL
        value: admin@dhiaspharmousy.in

      - key: ADMIN_PHONE
        value: 9142225559

      # Seeds the product catalogue on an empty store. Safe in production: the
      # seed creates no demo logins, only the admin above.
      - key: AUTO_SEED
        value: "true"

      # `console` prints OTPs to the service log. Switch to msg91 or twilio
      # once you have provider credentials, or real logins will not work.
      - key: OTP_PROVIDER
        value: console

      # Shown on invoices and in the storefront footer. Replace these.
      - key: GSTIN
        value: ""
      - key: DRUG_LICENSE_NUMBER
        value: ""

      # ------------------------------------------------------------------------
      # Persistent storage. Requires a paid `starter` plan; uncomment together
      # with changing `plan: free` above. A 1 GB disk is ample for a JSON file
      # plus prescription uploads.
      # ------------------------------------------------------------------------
      # disk:
      #   name: pharmacy-data
      #   mountPath: /app/data
      #   sizeGB: 1
