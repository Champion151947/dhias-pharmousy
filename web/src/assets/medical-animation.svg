<svg width="100%" height="100%" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="capsuleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  
  <!-- Floating pills animation -->
  <g class="floating-pills">
    <!-- Pill 1 -->
    <g transform="translate(100,100)">
      <animateTransform attributeName="transform" type="translate" values="100,100; 110,80; 100,100" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <ellipse rx="22" ry="12" fill="url(#pillGrad)" opacity="0.9">
        <animate attributeName="ry" values="12;10;12" dur="2s" repeatCount="indefinite"/>
      </ellipse>
      <rect x="-8" y="-10" width="16" height="20" fill="#fff" opacity="0.3" rx="4"/>
    </g>
    
    <!-- Pill 2 -->
    <g transform="translate(160,60)">
      <animateTransform attributeName="transform" type="translate" values="160,60; 170,45; 160,60" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <ellipse rx="16" ry="9" fill="#06b6d4" opacity="0.8">
        <animate attributeName="rx" values="16;14;16" dur="1.8s" repeatCount="indefinite"/>
      </ellipse>
      <line x1="-4" y1="0" x2="4" y2="0" stroke="#fff" stroke-width="2" opacity="0.6"/>
    </g>
    
    <!-- Pill 3 -->
    <g transform="translate(40,140)">
      <animateTransform attributeName="transform" type="translate" values="40,140; 30,150; 40,140" dur="4.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <ellipse rx="18" ry="10" fill="#14b8a6" opacity="0.85">
        <animate attributeName="ry" values="10;8;10" dur="2.2s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="0" cy="0" r="4" fill="#fff" opacity="0.4"/>
    </g>
    
    <!-- Capsule 1 -->
    <g transform="translate(170,160)">
      <animateTransform attributeName="transform" type="translate" values="170,160; 180,145; 170,160" dur="3.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <rect x="-10" y="-20" width="20" height="40" rx="10" fill="url(#capsuleGrad)" opacity="0.9"/>
      <rect x="-6" y="-16" width="12" height="8" rx="4" fill="#0d9488" opacity="0.5"/>
      <rect x="-6" y="8" width="12" height="8" rx="4" fill="#06b6d4" opacity="0.5"/>
    </g>
    
    <!-- Capsule 2 -->
    <g transform="translate(30,40)">
      <animateTransform attributeName="transform" type="translate" values="30,40; 20,30; 30,40" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <rect x="-8" y="-16" width="16" height="32" rx="8" fill="#0d9488" opacity="0.7"/>
      <rect x="-4" y="-12" width="8" height="6" rx="3" fill="#fff" opacity="0.4"/>
      <rect x="-4" y="6" width="8" height="6" rx="3" fill="#fff" opacity="0.3"/>
    </g>
    
    <!-- Tablet -->
    <g transform="translate(120,30)">
      <animateTransform attributeName="transform" type="translate" values="120,30; 115,20; 120,30" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <circle r="14" fill="#0d9488" opacity="0.8">
        <animate attributeName="r" values="14;12;14" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" opacity="0.8">500</text>
      <line x1="-6" y1="8" x2="6" y2="8" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
    </g>
    
    <!-- Cross tablet -->
    <g transform="translate(70,170)">
      <animateTransform attributeName="transform" type="translate" values="70,170; 65,158; 70,170" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <circle r="12" fill="#06b6d4" opacity="0.75">
        <animate attributeName="r" values="12;10;12" dur="2s" repeatCount="indefinite"/>
      </circle>
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#fff" stroke-width="2.5" opacity="0.8"/>
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#fff" stroke-width="2.5" opacity="0.8"/>
    </g>
  </g>
  
  <!-- Sparkles -->
  <g class="sparkles">
    <circle cx="85" cy="85" r="2" fill="#fff" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="r" values="1;4;1" dur="2s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="150" cy="120" r="2" fill="#fff" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="r" values="1;3;1" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="50" cy="50" r="2" fill="#fff" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="r" values="1;5;1" dur="3s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="180" cy="180" r="2" fill="#fff" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="r" values="1;3;1" dur="2.2s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>
  
  <!-- DNA helix decoration -->
  <g class="dna-helix" transform="translate(100,100)" opacity="0.05">
    <path d="M0,-80 Q20,-60 0,-40 Q-20,-20 0,0 Q20,20 0,40 Q-20,60 0,80" stroke="#0d9488" stroke-width="2" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-80 Q-20,-60 0,-40 Q20,-20 0,0 Q-20,20 0,40 Q20,60 0,80" stroke="#06b6d4" stroke-width="2" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="20s" repeatCount="indefinite"/>
    </path>
    <!-- Rungs -->
    <g>
      <line x1="-15" y1="-70" x2="15" y2="-70" stroke="#0d9488" stroke-width="1.5" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
      </line>
      <line x1="-15" y1="-30" x2="15" y2="-30" stroke="#06b6d4" stroke-width="1.5" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
      </line>
      <line x1="-15" y1="10" x2="15" y2="10" stroke="#0d9488" stroke-width="1.5" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
      </line>
      <line x1="-15" y1="50" x2="15" y2="50" stroke="#06b6d4" stroke-width="1.5" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>
</svg>